# 发行版发布后,在 Linux 上打 AppImage 并传到同一个发行版(Windows 的 zip 仍在本机打)。
# 补传旧版本:Actions 页面手动运行,填 tag。
name: Linux AppImage

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 发行版的 tag,如 v1.0.3
        required: true
      ref:
        description: 从哪个提交打,不填就用 tag。只修了打包脚本、版本号没变时填,如 dev
        required: false

permissions:
  contents: write

jobs:
  appimage:
    # 用旧一点的系统编译:AppImage 只能在 glibc 不比它旧的系统上跑。
    runs-on: ubuntu-22.04
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      # pubspec.lock 记的是国内镜像,照它下,依赖不会被重新解析。
      PUB_HOSTED_URL: https://pub.flutter-io.cn
      # 云上的机器没有 FUSE,appimagetool 解开再跑。
      APPIMAGE_EXTRACT_AND_RUN: 1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || env.TAG }}
      - run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev libsecret-1-dev patchelf
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
      - run: bash tool/build_release.sh
      - run: gh release upload "$TAG" dist/*/Penna-v*-linux-x86_64.AppImage --clobber
